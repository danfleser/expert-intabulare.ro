<!DOCTYPE html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{metaDescription}}">
    <!-- Title-->
    <title>{{title}}</title>
    <!-- Favicon-->
    <link rel="shortcut icon" href="/img/core-img/favicon.ico" type="image/x-icon">
    <!-- Fonts (D1 §4.5: Plex Sans 400/600/700 + Plex Mono 500, latin-ext)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
    <!-- Site Stylesheet-->
    <link rel="stylesheet" href="/css/site.css">
    <link rel="canonical" href="{{canonical}}">
    {{{hreflangTags}}}
    {{{jsonld}}}
  </head>
  <body>
    {{{header}}}
    <!-- Page hero-->
    <div class="page-hero">
      <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">{{{breadcrumbItems}}}</ol>
        </nav>
        <h1>{{h1}}</h1>
        {{{heroCta}}}
        <div class="data-strip">
          {{{dataStrip}}}
        </div>
      </div>
    </div>
    <!--content:start-->
    {{{content}}}
    <!--content:end-->
    {{{trustBar}}}
    <!-- Pre-footer CTA-->
    <div class="pb-120">
      <div class="container">
        <div class="card about-card"><div class="card-body">
          <h2 class="h4 mb-2">{{preFooterHeading}}</h2>
          <p class="mb-3">{{preFooterText}}</p>
          {{{preFooterCta}}}
        </div></div>
      </div>
    </div>
    {{{footer}}}
    {{{cookie}}}
    <!-- Sticky mobile CTA bar-->
    <nav class="sticky-bar" aria-label="Contact rapid">
      <a class="btn btn-wa" href="{{waBarHref}}" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i>WhatsApp</a>
      <a class="btn btn-ghost" href="tel:{{telHref}}" aria-label="Sunați la {{telDisplay}}">Sunați</a>
    </nav>
    <script>{{{chromeJs}}}</script>
    {{{extraJs}}}
  </body>
</html>
