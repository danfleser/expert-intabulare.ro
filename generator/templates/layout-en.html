<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{metaDescription}}">
    <!-- Title-->
    <title>{{title}}</title>
    <!-- Favicon-->
    <link rel="shortcut icon" href="/img/core-img/favicon.ico" type="image/x-icon">
    <!-- All CSS Stylesheet-->
    <link rel="stylesheet" href="/css/all-css-libraries.css">
    <!-- Core Stylesheet-->
    <link rel="stylesheet" href="/style.css">
    <link rel="canonical" href="{{canonical}}">
    {{{hreflangTags}}}
    <style>
      /* Inner-page adjustments only — theme CSS stays untouched */
      .header-area.header-2.sticky-on{background-color:#ffffff}
      .breadcrumb-wrapper{height:auto;min-height:0;padding:120px 0 48px}
      .breadcrumb-wrapper .breadcrumb-content{margin-top:0}
      .breadcrumb-wrapper .breadcrumb-title{color:#1f0757;text-align:left}
      .breadcrumb-wrapper .breadcrumb{justify-content:flex-start}
      .breadcrumb-wrapper .breadcrumb .breadcrumb-item{color:#8480ae}
      .breadcrumb-wrapper .breadcrumb .breadcrumb-item a{color:#0d6efd;font-size:.875rem}
      .breadcrumb-wrapper .breadcrumb .breadcrumb-item+.breadcrumb-item::before{color:#8480ae}
      @media print{.header-area,.footer-area,.cookiealert,.cta-whatsapp,.trust-bar,.breadcrumb-wrapper .breadcrumb{display:none!important}.breadcrumb-wrapper{padding:0;background:none}}
    </style>
    {{{jsonld}}}
  </head>
  <body class="bg-white">
    {{{header}}}
    <!-- Breadcrumb Area-->
    <div class="breadcrumb-wrapper">
      <div class="container">
        <div class="breadcrumb-content">
          <h1 class="breadcrumb-title mb-3">{{h1}}</h1>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb d-flex flex-wrap">{{{breadcrumbItems}}}</ol>
          </nav>
          {{{heroCta}}}
        </div>
      </div>
    </div>
    <!--content:start-->
    {{{content}}}
    <!--content:end-->
    {{{trustBar}}}
    <!-- Pre-footer CTA-->
    <div class="pb-120">
      <div class="container">
        <div class="card about-card"><div class="card-body p-4 p-md-5">
          <h2 class="h4 mb-2">{{preFooterHeading}}</h2>
          <p class="mb-3">{{preFooterText}}</p>
          {{{preFooterCta}}}
        </div></div>
      </div>
    </div>
    {{{footer}}}
    {{{cookie}}}
    <script>{{{chromeJs}}}</script>
    {{{extraJs}}}
  </body>
</html>
