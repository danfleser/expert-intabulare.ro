<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{metaDescription}}">
    <!-- Title-->
    <title>{{title}}</title>
    <!-- Favicon-->
    <link rel="shortcut icon" href="/img/core-img/favicon.ico" type="image/x-icon">
    <!-- Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap">
    <!-- Site Stylesheet-->
    <link rel="stylesheet" href="/css/site.css">
    <link rel="canonical" href="{{canonical}}">
    {{{hreflangTags}}}
    {{{jsonld}}}
  </head>
  <body class="bg-white">
    {{{header}}}
    <!-- Page hero-->
    <div class="page-hero">
      <div class="container">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb d-flex flex-wrap">{{{breadcrumbItems}}}</ol>
        </nav>
        <h1 class="mb-2">{{h1}}</h1>
        <p class="credential-line"><i class="bi bi-patch-check-fill me-1"></i>ANCPI licensed surveyor · 25+ years of experience</p>
        {{{heroCta}}}
      </div>
    </div>
    <!--content:start-->
    {{{content}}}
    <!--content:end-->
    {{{trustBar}}}
    <!-- Pre-footer CTA-->
    <div class="pb-120">
      <div class="container">
        <div class="card about-card"><div class="card-body p-4 p-md-5">
          <h2 class="h4 mb-2">{{preFooterHeading}}</h2>
          <p class="mb-3">{{preFooterText}}</p>
          {{{preFooterCta}}}
        </div></div>
      </div>
    </div>
    {{{footer}}}
    {{{cookie}}}
    <!-- Sticky mobile CTA bar-->
    <nav class="mobile-cta-bar" aria-label="Quick contact">
      <a href="{{waBarHref}}" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i>WhatsApp</a>
      <a href="tel:{{telHref}}" aria-label="Call"><i class="bi bi-telephone"></i>{{telDisplay}}</a>
    </nav>
    <script>{{{chromeJs}}}</script>
    {{{extraJs}}}
  </body>
</html>
