<!-- WhatsApp CTA (BINDING spec §3.5): static prebuilt anchor + tel secondary-->
<div class="cta-whatsapp cta-row{{extraClass}}">
  <a class="btn btn-wa" href="{{waHref}}" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i>{{waLabel}}</a>
  <a class="btn btn-ghost" href="tel:{{telHref}}"><i class="bi bi-telephone"></i>{{telDisplay}}</a>
</div>
