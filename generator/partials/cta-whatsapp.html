<!-- WhatsApp CTA (BINDING spec §3.5): static prebuilt anchor + tel secondary-->
<div class="cta-whatsapp d-flex flex-wrap align-items-center{{extraClass}}">
  <a class="btn btn-wa me-3 mb-2" href="{{waHref}}" target="_blank" rel="noopener"><i class="bi bi-whatsapp me-2"></i>{{waLabel}}</a>
  <a class="btn btn-tel mb-2" href="tel:{{telHref}}"><i class="bi bi-telephone me-2"></i>{{telDisplay}}</a>
</div>
